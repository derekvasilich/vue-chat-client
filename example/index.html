<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Widget — Example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #64748b; margin-bottom: 40px; font-size: 16px; }
    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; color: #374151; }
    label { font-size: 13px; font-weight: 500; color: #374151; display: block; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #2563eb; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    button:hover { background: #1d4ed8; }
    button.secondary {
      background: none;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    button.secondary:hover { background: #f3f4f6; }
    .status { font-size: 12px; color: #6b7280; margin-top: 8px; min-height: 18px; }
    pre {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
      overflow-x: auto;
      line-height: 1.5;
    }
    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <script type="module" src="./main.ts"></script>

  <script>
    function setToken() {
      const val = document.getElementById('token-input').value.trim()
      if (!val) return
      window.AIChatWidget.setToken(val)
      document.getElementById('token-status').textContent = '✓ Token set'
      setTimeout(() => { document.getElementById('token-status').textContent = '' }, 3000)
    }

    function sendMsg() {
      const val = document.getElementById('msg-input').value.trim()
      if (!val) return
      window.postMessage({ type: 'AI_CHAT_SEND', message: val }, '*')
      document.getElementById('msg-status').textContent = '✓ postMessage sent'
      setTimeout(() => { document.getElementById('msg-status').textContent = '' }, 3000)
    }

    function sendDirect() {
      const val = document.getElementById('msg-input').value.trim()
      if (!val) return
      window.AIChatWidget.sendMessage(val)
      document.getElementById('msg-status').textContent = '✓ Sent via AIChatWidget.sendMessage()'
      setTimeout(() => { document.getElementById('msg-status').textContent = '' }, 3000)
    }
  </script>
</body>
</html>
